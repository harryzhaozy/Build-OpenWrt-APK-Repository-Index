name: Build, Sign and Publish OpenWrt APK Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Prepare Signing Keys
        env:
          PRIVATE_KEY_DATA: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY_DATA" ]; then
            echo "Error: APK_PRIVATE_KEY is not set in Repository Secrets!"
            exit 1
          fi
          echo "$PRIVATE_KEY_DATA" > private-key.pem
          chmod 600 private-key.pem

      - name: Download latest Passwall APKs
        run: |
          mkdir -p downloaded_apks
          cd downloaded_apks
          
          APK_URLS=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          
          if [ -z "$APK_URLS" ]; then
            echo "未找到 APK 文件"
            exit 1
          fi

          for url in $APK_URLS; do
            echo "Downloading $url..."
            curl -sL -O "$url"
          done

      - name: Generate Signed packages.adb Index via Alpine Container
        run: |
          docker run --rm \
            -v "$(pwd):/work" \
            -w /work \
            alpine:latest sh -c "
              apk add --no-cache apk-tools && \
              cd downloaded_apks && \
              # 1. 生成标准的 packages.adb
              apk mkndx --allow-untrusted --sign ../private-key.pem --output ../packages.adb *.apk
            "

      - name: Clean up sensitive key
        if: always()
        run: |
          rm -f private-key.pem

      - name: Prepare Release Assets
        run: |
          # 创建统一存放待上传文件的目录
          mkdir -p upload_assets
          
          # 将所有 downloaded_apks 下的 apk 文件和 packages.adb 复制出来（平铺）
          cp downloaded_apks/*.apk upload_assets/ 2>/dev/null || true
          cp packages.adb upload_assets/ 2>/dev/null || true
          

      - name: Commit and Push packages.adb to repository root
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add packages.adb
          
          if git diff --staged --quiet; then
            echo "packages.adb 没有变化，跳过 commit"
          else
            git commit -m "chore: update packages.adb [skip ci]"
            git push
          fi

      - name: Publish/Overwrite APKs to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "Latest Passwall APKs" --notes "自动更新的 Passwall APK 文件及软件包索引"
          fi

          # 注意：末尾加上 /* 确保传给 gh 的是文件列表，而不是文件夹目录
          gh release upload "$TAG_NAME" upload_assets/* --clobber
