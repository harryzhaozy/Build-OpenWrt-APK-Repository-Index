name: Build, Sign and Publish OpenWrt APK Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Fetch Remote Release Info & Check for Updates
        id: check_version
        run: |
          # 1. 获取上游 Openwrt-Passwall 最新 Release 的 Tag 名称 (如 26.7.24)
          UPSTREAM_JSON=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest)
          UPSTREAM_TAG=$(echo "$UPSTREAM_JSON" | jq -r '.tag_name // empty')

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "错误：未能获取到上游 Release 信息！"
            exit 1
          fi

          echo "上游最新版本 Tag: $UPSTREAM_TAG"

          # 2. 从我们已发布的 GitHub Pages 读取上一次记录的版本文件（version.txt）
          PAGES_VERSION=$(curl -sL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/version.txt" || true)

          echo "当前已发布版本: $PAGES_VERSION"

          # 3. 比对版本号
          if [ "$UPSTREAM_TAG" = "$PAGES_VERSION" ]; then
            echo "::notice::上游 Passwall 尚未更新 (当前已是最新版 $UPSTREAM_TAG)，终止本次构建。"
            echo "has_update=false" >> $GITHUB_OUTPUT
          else
            echo "发现上游新版本：$PAGES_VERSION -> $UPSTREAM_TAG"
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Signing Keys
        if: steps.check_version.outputs.has_update == 'true'
        env:
          PRIVATE_KEY_DATA: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY_DATA" ]; then
            echo "Error: APK_PRIVATE_KEY is not set in Repository Secrets!"
            exit 1
          fi
          echo "$PRIVATE_KEY_DATA" > private-key.pem
          chmod 600 private-key.pem

      - name: Download latest Passwall APKs and Sanitize Filenames
        if: steps.check_version.outputs.has_update == 'true'
        run: |
          mkdir -p downloaded_apks
          cd downloaded_apks
          
          # 提取所有 apk 的下载链接
          APK_URLS=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          
          if [ -z "$APK_URLS" ]; then
            echo "未找到 APK 文件"
            exit 1
          fi

          for url in $APK_URLS; do
            echo "Downloading $url..."
            curl -sL -O "$url"
          done

          # 清理文件名中的乱码/前缀 (例如 25.12+_luci-... -> luci-...)
          for file in *luci-*.apk; do
            if [ -f "$file" ]; then
              clean_name=$(echo "$file" | sed -E 's/.*(luci-.*\.apk)$/\1/')
              if [ "$file" != "$clean_name" ]; then
                echo "Renaming '$file' -> '$clean_name'"
                mv "$file" "$clean_name"
              fi
            fi
          done

          # 写入最新版本号标记文件，用于下次比对
          echo "${{ steps.check_version.outputs.upstream_tag }}" > version.txt

      - name: Generate Signed packages.adb
        if: steps.check_version.outputs.has_update == 'true'
        run: |
          docker run --rm \
            -v "$(pwd):/work" \
            -w /work \
            alpine:latest sh -c "
              apk add --no-cache apk-tools && \
              cd downloaded_apks && \
              apk mkndx --allow-untrusted \
                --sign ../private-key.pem \
                --output packages.adb \
                *.apk
            "

      - name: Clean up sensitive key
        if: always() && steps.check_version.outputs.has_update == 'true'
        run: |
          rm -f private-key.pem

      - name: Deploy to GitHub Pages
        if: steps.check_version.outputs.has_update == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./downloaded_apks
          keep_files: false
          force_orphan: true
