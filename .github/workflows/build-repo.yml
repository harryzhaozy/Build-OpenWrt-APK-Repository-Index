name: Build, Sign and Publish OpenWrt APK Repo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Prepare Signing Keys
        env:
          PRIVATE_KEY_DATA: ${{ secrets.APK_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY_DATA" ]; then
            echo "Error: APK_PRIVATE_KEY is not set in Repository Secrets!"
            exit 1
          fi
          echo "$PRIVATE_KEY_DATA" > private-key.pem
          chmod 600 private-key.pem

      - name: Download latest Passwall APKs and Sanitize Filenames
        run: |
          mkdir -p downloaded_apks
          cd downloaded_apks
          
          # 1. 获取最新 release 中的 apk 下载链接
          APK_URLS=$(curl -s https://api.github.com/repos/Openwrt-Passwall/openwrt-passwall/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          
          if [ -z "$APK_URLS" ]; then
            echo "未找到 APK 文件"
            exit 1
          fi

          # 2. 下载所有 apk
          for url in $APK_URLS; do
            echo "Downloading $url..."
            curl -sL -O "$url"
          done

          # 3. 关键修正：清理文件名中的前缀和异常字符 (例如把 25.12+_luci-... 重命名为 luci-...)
          for file in *luci-*.apk; do
            if [ -f "$file" ]; then
              # 提取从 "luci-" 开始的标准包名
              clean_name=$(echo "$file" | sed -E 's/.*(luci-.*\.apk)$/\1/')
              if [ "$file" != "$clean_name" ]; then
                echo "Renaming '$file' -> '$clean_name'"
                mv "$file" "$clean_name"
              fi
            fi
          done
      - name: Generate Signed packages.adb
        run: |
          docker run --rm \
            -v "$(pwd):/work" \
            -w /work \
            alpine:latest sh -c "
              apk add --no-cache apk-tools && \
              cd downloaded_apks && \
              apk mkndx --allow-untrusted \
                --sign ../private-key.pem \
                --output packages.adb \
                *.apk
            "

      - name: Clean up sensitive key
        if: always()
        run: |
          rm -f private-key.pem

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./downloaded_apks
          keep_files: false
          force_orphan: true
